# The front page. Most important first: Bitcoin's forecast and the odds on its next hour, gold's forecast and the
# odds on its next close, then the chain, the news, the world, and the trailing numbers last. A page taller than
# the screen: j and k walk it, 1-9 jump to a window.
# Commodities are priced in Bitcoin here (`GLCO SATS`): gold reads ₿5,453,863 an ounce rather than $4,425.
# `$` on the window flips it back to dollars; drop the word to make dollars the default again.
