# Glimpse Terminal instrument map. DRAFT from Phase 0 live verification, 2026-09-19.
#
# Every identifier below was seen in a live response on 2026-09-19. Nothing is invented.
# See SOURCES.md for the evidence.
#
# sources  ordered, KEYLESS sources that answered on 2026-09-19. The resolver takes the first healthy one.
# keyed    sources that are real but need an API key. Pyth Hermes has required a key since 2026-08-26
#          (HTTP 401 without one), so every pyth:<feed id> lives here, not in sources.
#          The ids come from the still-public catalogue GET https://hermes.pyth.network/v2/price_feeds.
# proxy    ticker of another instrument in this file to show beside this one, always labelled as a proxy.
#
# Source schemes:
#   coinbase:<product id>      api.exchange.coinbase.com/products/<id>/ticker, WS product_ids
#   kraken:<REST pair>         api.kraken.com/0/public/Ticker?pair=<pair>; WS v2 symbol is the wsname (BTC/USD, EUR/USD)
#   bitstamp:<url symbol>      www.bitstamp.net/api/v2/ticker/<symbol>/, WS live_trades_<symbol>
#   ecb:<CCY>                  eurofxref-daily.xml, units of CCY per 1 EUR. The note says how to cross it to USD.
#   fred:<series id>           fred.stlouisfed.org/graph/fredgraph.csv?id=<id>
#   treasury:<field>           d:<field> in the daily_treasury_yield_curve XML, percent
#   pyth:<64 hex feed id>      Hermes, needs a key
#   computed:<name>            derived locally, labelled computed
#
# session: "24x7" | "24x5" | "us_equity" | "daily". "daily" means the best keyless source is an end-of-day series
# (several FRED commodity series are in fact monthly: the note says so).

