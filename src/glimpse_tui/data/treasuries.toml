# Bitcoin treasury companies. DRAFT written on 2026-09-19 by the Phase 0 source check.
#
# STATUS: SEC EDGAR refused every request made during the check (HTTP 403,
# "Undeclared Automated Tool"), because the two permitted User-Agent strings
# carry no contact email. So NOTHING here was checked against
# www.sec.gov/files/company_tickers.json, and no XBRL element was confirmed.
# See SOURCES.md.
#
# Field rules:
#   cik            ten digits, zero padded. "" means not yet looked up.
#   cik_status     "brief"      = supplied in the task brief, not confirmed against SEC
#                  "unverified" = not looked up. Fill from company_tickers.json.
#   holdings       "xbrl"   = read from SEC company facts (quarter-end values, so they lag)
#                  "manual" = the btc / as_of / source_url fields below
#   xbrl_element   "" until a real companyfacts file has been searched. Never guess one.
#                  TRSY does not need it: data/sec.py searches each company's own facts file at
#                  run time for crypto concepts and shows the element it found beside the number
#                  (PLAN D38). A value here ("taxonomy:Concept", read from a live file) pins the
#                  unit-count element for that company and overrides the search.
#   short          optional. The name TRSY shows when the full one is too long for its column.
#   btc = 0 with note = "unverified" means no official figure was fetched.
#
# Tickers and names of the entries marked "unverified" are from general knowledge
# and must be confirmed against company_tickers.json before this file ships.

