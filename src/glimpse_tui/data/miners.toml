# Public Bitcoin miners. DRAFT written on 2026-09-19 by the Phase 0 source check.
#
# STATUS: SEC EDGAR refused every request made during the check (HTTP 403), so no
# CIK here was checked against www.sec.gov/files/company_tickers.json and no XBRL
# element was confirmed. See SOURCES.md.
#
# Field rules:
#   cik            ten digits, zero padded. "" means not yet looked up.
#   cik_status     "brief" = supplied in the task brief, not confirmed against SEC.
#                  "unverified" = not looked up.
#   filer_type     "domestic" files 10-K / 10-Q / 8-K with us-gaap XBRL facts.
#                  "foreign"  files 20-F or 40-F and 6-K. Such filers may report under
#                  IFRS (facts under the `ifrs-full` taxonomy, not `us-gaap`), have no
#                  quarterly XBRL, and put monthly updates in 6-K exhibits.
#                  Every filer_type below is an expectation to confirm from the
#                  `form` values in the company's submissions JSON.
#   xbrl_element   "" until a real companyfacts file has been searched. Never guess one.
#   xbrl_element   as in treasuries.toml: MINR discovers the element at run time (PLAN D38); a value
#                  here pins it.
#   hashrate       self-reported, from monthly production updates (8-K / 6-K / press
#                  release). No open feed exists. Manual until one does. A company with no
#                  sourced figure has no hashrate fields at all, and MINR shows a dash. To add one:
#                    hashrate_eh = 0.0        energised hashrate in EH/s, as the company stated it
#                    hashrate_as_of = ""      the date the update covers, YYYY-MM-DD
#                    hashrate_url = ""        the 8-K, 6-K or press release it was read from
#                  All three or none. A number without a source you fetched stays out.

